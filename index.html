        body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; padding:32px; color:#131a2b;}
        h1{font-size:20px; margin-bottom:2px;}
        h2{font-size:15px; margin:26px 0 10px;}
        .sub{color:#6b7280; font-size:13px; margin-bottom:6px;}
        table{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:8px;}
        th,td{border:1px solid #d8dce4; padding:7px 10px; text-align:left;}
        th{background:#0d2140; color:#fff; font-weight:700;}
        tr:nth-child(even){background:#f6f7fa;}
        @media print{ body{padding:12px;} }
      </style></head><body>
      <h1>碧潭能源管理系統 － 用量趨勢分析報告</h1>
      <div class="sub">篩選群組：${escapeHtml(groupLabel)} ｜ 類型：${typeLabel} ｜ 期間：近${chartPeriodMonths}期（至 ${currentMonthKey}）</div>
      <div class="sub">匯出時間：${new Date().toLocaleString("zh-TW")}</div>

      <h2>月度用量趨勢</h2>
      <table><thead><tr><th>月份</th><th>總用量（度）</th></tr></thead><tbody>${trendRows}</tbody></table>

      <h2>本期用量排行（依用量高至低）</h2>
      <table><thead><tr><th>#</th><th>群組</th><th>站點</th><th>類型</th><th>用量（度）</th></tr></thead><tbody>${rankHtml || '<tr><td colspan="5" style="text-align:center;color:#9aa3b2">本期尚無已抄錄資料</td></tr>'}</tbody></table>
      ${costSectionHtml}
      </body></html>`);
    printWin.document.close();
    printWin.focus();
    setTimeout(()=>printWin.print(), 300);
  });
  // ==================== 圖表分析結束 ====================

  // ---- Bottom nav filter ----
  document.querySelectorAll(".nav-item[data-filter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".nav-item[data-filter]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  // ---- Search ----
  document.getElementById("searchBox").addEventListener("input", render);

  // ---- Save all（強制送出所有還在防抖動等待中的本期讀數）----
  document.getElementById("saveAllBtn").addEventListener("click", async ()=>{
    await flushPendingCurrSaves();
    showToast("已儲存本期抄錶資料");
  });

  // ---- Photo capture ----
  document.getElementById("cameraInput").addEventListener("change", async e=>{
    const file = e.target.files[0];
    const targetId = currentPhotoTargetId;
    e.target.value = "";
    if(!file || !targetId) return;
    showToast("照片儲存中…");
    try{
      const fd = new FormData();
      fd.append("file", file);
      const photo = await apiFetch("/readings/"+targetId+"/photos?month="+encodeURIComponent(currentMonthKey), {
        method:"POST", body: fd
      }).then(r=>r.json());
      const readings = loadReadings(currentMonthKey);
      if(!readings[targetId]) readings[targetId] = {curr:"", photos:[]};
      if(!readings[targetId].photos) readings[targetId].photos = [];
      readings[targetId].photos.push({id:photo.id, url:photoUrl(photo.id)});
      render();
      showToast("照片已附加");
    }catch(err){
      showToast(err.message || "照片儲存失敗");
    }
  });

  // ---- Toast ----
  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  // ---- Record date default ----
  // ---- 自訂日期選擇器（抄錄日） ----
  let recordDate = new Date();      // 目前選定的抄錄日
  let calViewYear = recordDate.getFullYear();
  let calViewMonth = recordDate.getMonth(); // 0-indexed

  function pad2(n){ return String(n).padStart(2,"0"); }
  function isSameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function updateRecordDateText(){
    const d = recordDate;
    document.getElementById("recordDateText").textContent =
      `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
  }
  function renderCalendar(){
    document.getElementById("calMonthLabel").textContent = `${calViewYear}年${calViewMonth+1}月`;
    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
    const startWeekday = firstOfMonth.getDay(); // 0=Sun
    const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(calViewYear, calViewMonth, 0).getDate();
    const today = new Date();

    const cells = [];
    for(let i=startWeekday-1;i>=0;i--){
      cells.push({day:daysInPrevMonth-i, other:true, y:calViewMonth===0?calViewYear-1:calViewYear, m:calViewMonth===0?11:calViewMonth-1});
    }
    for(let d=1; d<=daysInMonth; d++){
      cells.push({day:d, other:false, y:calViewYear, m:calViewMonth});
    }
    let nextDay = 1;
    while(cells.length % 7 !== 0 || cells.length < 42){
      cells.push({day:nextDay, other:true, y:calViewMonth===11?calViewYear+1:calViewYear, m:calViewMonth===11?0:calViewMonth+1});
      nextDay++;
      if(cells.length>=42) break;
    }

    cells.forEach(c=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cal-day" + (c.other ? " other-month" : "");
      btn.textContent = c.day;
      const cellDate = new Date(c.y, c.m, c.day);
      if(isSameDay(cellDate, today)) btn.classList.add("is-today");
      if(isSameDay(cellDate, recordDate)) btn.classList.add("is-selected");
      btn.addEventListener("click", ()=>{
        recordDate = cellDate;
        updateRecordDateText();
        document.getElementById("dateOverlay").classList.remove("open");
      });
      grid.appendChild(btn);
    });
  }
  document.getElementById("recordDateBtn").addEventListener("click", ()=>{
    calViewYear = recordDate.getFullYear();
    calViewMonth = recordDate.getMonth();
    renderCalendar();
    document.getElementById("dateOverlay").classList.add("open");
  });
  document.getElementById("calPrevBtn").addEventListener("click", ()=>{
    calViewMonth--; if(calViewMonth<0){ calViewMonth=11; calViewYear--; }
    renderCalendar();
  });
  document.getElementById("calNextBtn").addEventListener("click", ()=>{
    calViewMonth++; if(calViewMonth>11){ calViewMonth=0; calViewYear++; }
    renderCalendar();
  });
  document.getElementById("calTodayBtn").addEventListener("click", ()=>{
    recordDate = new Date();
    updateRecordDateText();
    document.getElementById("dateOverlay").classList.remove("open");
  });
  document.getElementById("calCloseBtn").addEventListener("click", ()=>{
    document.getElementById("dateOverlay").classList.remove("open");
  });
  document.getElementById("dateOverlay").addEventListener("click", e=>{
    if(e.target.id === "dateOverlay") e.currentTarget.classList.remove("open");
  });
  updateRecordDateText();

  // ---- 登入畫面 ----
  const loginOverlayEl = document.getElementById("loginOverlay");
  const loginErrorEl = document.getElementById("loginError");
  const LAST_USERNAME_KEY = "bitan_last_username_v1";
  function showLoginOverlay(){
    const savedUsername = localStorage.getItem(LAST_USERNAME_KEY) || "";
    const usernameInput = document.getElementById("loginUsername");
    usernameInput.value = savedUsername;
    document.getElementById("loginRemember").checked = !!savedUsername;
    loginOverlayEl.classList.add("open");
    // 帳號已經記住了，游標直接跳到密碼欄，不用使用者自己點
    if(savedUsername) document.getElementById("loginPassword").focus();
    else usernameInput.focus();
  }
  function hideLoginOverlay(){
    loginOverlayEl.classList.remove("open");
  }
  onAuthRequired = showLoginOverlay;

  async function apiLogin(username, password){
    const res = await fetch(API_BASE + "/auth/login", {
      method:"POST", credentials:"include", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username, password})
    });
    if(!res.ok){
      let message = "帳號或密碼錯誤";
      try{ const body = await res.json(); if(body && body.message) message = body.message; }catch(e){}
      throw new Error(message);
    }
    return res.json();
  }

  document.getElementById("loginPasswordToggle").addEventListener("click", ()=>{
    const input = document.getElementById("loginPassword");
    const btn = document.getElementById("loginPasswordToggle");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? "🙈" : "👁";
    btn.title = show ? "隱藏密碼" : "顯示密碼";
    btn.setAttribute("aria-label", btn.title);
  });

  document.getElementById("loginForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginSubmitBtn");
    loginErrorEl.classList.remove("show");
    btn.disabled = true;
    try{
      const me = await apiLogin(username, password);
      if(document.getElementById("loginRemember").checked){
        localStorage.setItem(LAST_USERNAME_KEY, username);
      }else{
        localStorage.removeItem(LAST_USERNAME_KEY);
      }
      currentUserRole = me.role;
      currentUserAssignedGroups = me.assignedGroups || [];
      applyRoleUI();
      const pwdInput = document.getElementById("loginPassword");
      pwdInput.value = "";
      pwdInput.type = "password";
      const pwdToggleBtn = document.getElementById("loginPasswordToggle");
      pwdToggleBtn.textContent = "👁";
      pwdToggleBtn.title = "顯示密碼";
      pwdToggleBtn.setAttribute("aria-label", "顯示密碼");
      hideLoginOverlay();
      await bootAppData();
    }catch(err){
      loginErrorEl.textContent = err.message || "登入失敗";
      loginErrorEl.classList.add("show");
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById("mLogout").addEventListener("click", ()=>{
    showConfirm("確定要登出嗎？", async ()=>{
      try{ await fetch(API_BASE+"/auth/logout", {method:"POST", credentials:"include"}); }catch(e){}
      location.reload();
    }, {title:"登出", okLabel:"登出", danger:true});
  });

  // ---- init ----
  async function bootAppData(){
    buildMonthOptions();
    try{
      await loadSites();
      await loadAllReadings();
      render();
    }catch(e){
      showToast(e.message || "載入資料失敗，請重新整理頁面");
    }
  }

  async function bootApp(){
    loadSettings();
    try{
      const res = await fetch(API_BASE + "/auth/me", {credentials:"include"});
      if(res.ok){
        const me = await res.json();
        currentUserRole = me.role;
        currentUserAssignedGroups = me.assignedGroups || [];
        applyRoleUI();
        hideLoginOverlay();
        await bootAppData();
      }else{
        showLoginOverlay();
      }
    }catch(e){
      showLoginOverlay();
    }
  }
  bootApp();
})();
</script>
</body>
</html>
